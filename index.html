<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 12</title>
  </head>
  <body>
    <form action="">
      <label for="pass">Ingrese la contraseña</label>
      <input type="password" id="pass" />
      <label for="caja">Ingrese el texto</label>
      <textarea name="" id="caja"></textarea>
      <label for="Numero">Ingrese un numero</label>
      <input type="number" name="" id="Numero" min="5" />
      <p>Seleccione el genero</p>
      <input type="radio" name="Genero" id="Masculino" value="M" />
      <label for="Masculino">Masculino</label>
      <input type="radio" id="Femenino" name="Genero" value="F" />
      <label for="Femenino">Femenino</label>
      <p>Deportes que le gusten</p>
      <input type="checkbox" name="Deporte" id="Futbol" value="F" />
      <label for="Futbol">Futbol</label>
      <input type="checkbox" name="Deporte" id="Basquet" value="B" />
      <label for="Basquet">Basquet</label>
      <input type="checkbox" name="Deporte" id="Rugby" value="R" />
      <label for="Rugby">Rugby</label>
      <p>Color favorito</p>
      <select name="select" id="selecT">
        <option value="Default"></option>
        <option value="ColorAzul">Azul</option>
        <option value="ColorBlanco">Blanco</option>
        <option value="ColorRojo">Rojo</option>
      </select>
    </form>
  </body>
</html>
